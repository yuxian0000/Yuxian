<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photography</title>

  <style>
    body {
      margin: 0;
      background: white;
      color: black;
      font-family: Arial, sans-serif;
    }

    .header {
  position: fixed;
  top: 40px;
  left: 40px;
  z-index: 1000;
}

    h1 {
  margin: 0;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0;
}

    p {
      color: #444;
  font-size: 12px;
  font-weight: 600;
    }

    .gallery {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  padding: 40px 10px 10px 10px;
}

    .gallery img {
  width: 100%;
  max-width: 600px;
  display: block;
}
@media (max-width: 768px) {
  h1 {
    font-size: 24px;
  }

  p {
    font-size: 12px;
  }

  .header {
  position: sticky;
  top: 0;
  background:  transparent;
  z-index: 1000;
  padding: 10px 10px 0 10px;
}
}
  </style>
</head>

<body>

  <div class="header">

</body>
</html>
