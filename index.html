<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Photography</title>

  <style>
    body {
      margin: 0;
      background: black;
      color: white;
      font-family: Arial, sans-serif;
    }

    .header {
      padding: 40px;
    }

    h1 {
      margin: 0;
      font-size: 42px;
    }

    p {
      color: #999;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 10px;
      padding: 10px;
    }

    .gallery img {
      width: 100%;
      display: block;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>My Photography</h1>
    <p>Visual archive</p>
  </div>

  <div class="gallery">
    <img src="x2498201208.jpg">
  </div>

</body>
</html>
