<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photography</title>

  <style>
    body {
      margin: 0;
      background: white;
      color: black;
      font-family: Arial, sans-serif;
    }

    .header {
      padding: 40px;
    }

    h1 {
      margin: 0;
      font-size: 42px;
    }

    p {
      color: #444;
  font-size: 12px;
  font-weight: 600;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 10px;
      padding: 2px 10px 10px 10px;
    }

    .gallery img {
      width: 100%;
      display: block;
    }
@media (max-width: 768px) {
  h1 {
    font-size: 24px;
  }

  p {
    font-size: 12px;
  }

  .header {
    padding: 20px;
  }
}
  </style>
</head>

<body>

  <div class="header">
    <h1>Photographs</h1>
    <p>鱼线</p>
  </div>

  <div class="gallery">
    <img src="x2498201208.jpg">
    <img src="02.jpg"> 
    <img src="03.jpg">
    <img src="04.jpg">
    <img src="05.jpg">
    <img src="06.jpg">
  </div>

</body>
</html>
