<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photography</title>

  <style>
    body {
      margin: 0;
      background: white;
      color: black;
      font-family: Arial, sans-serif;
    }

    .header {
      padding: 40px;
    }

    h1 {
      margin: 0;
      font-size: 42px;
    }

    p {
      color: #444;
  font-size: 12px;
  font-weight: 600;
    }

    .gallery {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  padding: 0px 10px 10px 10px;
}

    .gallery img {
  width: 100%;
  max-width: 900px;
  display: block;
}
@media (max-width: 768px) {
  h1 {
    font-size: 24px;
  }

  p {
    font-size: 12px;
  }

  .header {
  position: sticky;
  top: 0;
  background:  transparent;
  z-index: 1000;
  padding: 10px 10px 0 10px;
}
}
  </style>
</head>

<body>

  <div class="header">
    <h1>Photographs</h1>
    <p>鱼线</p>
  </div>

  <div class="gallery">
    <img src="x2498201208.jpg">
    <img src="02.jpg"> 
    <img src="03.jpg">
    <img src="04.jpg">
    <img src="05.jpg">
    <img src="06.jpg">
  </div>

</body>
</html>
