<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photography</title>

  <style>
    body {
      margin: 0;
      background: white;
      color: black;
      font-family: Arial, sans-serif;
    }

    .header {
  position: fixed;
  top: 40px;
  left: 40px;
  z-index: 1000;
}

    h1 {
  margin: 0;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0;
}

    p {
      color: #444;
  font-size: 12px;
  font-weight: 600;
    }
    .fragment-link {
  display: block;
  width: fit-content;
  color: #444;
  font-size: 9px;
  font-weight: 600;
  text-decoration: none;
  border-bottom: 1px solid transparent;
  transition: border-color 0.25s ease;
}

    .fragment-link:hover {
  border-bottom: 1px solid #d6d6d6;
}
    .archive-title {
  color: black;
  font-size: 10px;
  font-weight: 600;
  margin: 10px 0 8px 0;
  cursor: pointer;
}

    #archive-icon {
  display: inline-block;
  margin-right: 5px;
  font-size: 12px;
  font-weight: 700;
  line-height: 1;
}
    
.divider {
  margin: 6px 0;
  color: #444;
  font-size: 10px;
}

#archive-links {
  max-height: 500px;
  overflow: hidden;
  opacity: 1;
  transition: max-height 0.5s ease, opacity 0.5s ease;
}

#archive-links.collapsed {
  max-height: 0;
  opacity: 0;
}

    .fragment-link:first-of-type {
  margin-top: 0px;
}
    .fragment-link + .fragment-link {
  margin-top: 6px;
}

    .gallery {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  padding: 40px 10px 10px 10px;
}

    .gallery img {
  width: 100%;
  max-width: 600px;
  display: block;
}
@media (max-width: 768px) {
  h1 {
    font-size: 24px;
  }

  p {
    font-size: 12px;
  }

  .header {
  position: sticky;
  top: 0;
  background:  transparent;
  z-index: 1000;
  padding: 10px 10px 0 10px;
}
}
  </style>
</head>

<body>

  <div class="header">
  <h1>Photographs</h1>
  <p>鱼线</p>

  <p class="divider">-</p>

  <p class="archive-title" onclick="toggleArchive()">
  <span id="archive-icon">⌄</span> &lt;Personal Archive&gt;
</p>

  <div id="archive-links">
  <a href="fragments.html" class="fragment-link">Chapter I</a>
  <a href="places.html" class="fragment-link">Chapter II</a>
</div>
</div>

  <div class="gallery">
    <img src="010.jpg">

    <img src="030.jpg">

    <img src="060.jpg">

    <img src="080.jpg">
    <img src="090.jpg">
    <img src="100.jpg">
    <img src="110.jpg">
    <img src="120.jpg">
    <img src="130.jpg">
    <img src="140.jpg">
    <img src="150.jpg">
    <img src="160.jpg">
    <img src="170.jpg">
    <img src="180.jpg">
    <img src="190.jpg">
    <img src="200.jpg">
    <img src="210.jpg">
    <img src="220.jpg">
    <img src="230.jpg">
    <img src="240.jpg">
    <img src="250.jpg">
    <img src="260.jpg">
    <img src="270.jpg">
  </div>

  <script>
function toggleArchive() {
  const links = document.getElementById('archive-links');
  const icon = document.getElementById('archive-icon');

  links.classList.toggle('collapsed');

  if (links.classList.contains('collapsed')) {
    icon.textContent = '›';
  } else {
    icon.textContent = '⌄';
  }
}
</script>
</body>
</html>
